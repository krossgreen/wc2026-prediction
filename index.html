                  </div>
                  <div className="col-span-4 flex items-center">
                    <span className="truncate">{user.name}</span>
                  </div>
                  <div className="col-span-2 flex justify-center gap-1 md:gap-2 items-center">
                    {user.form.length > 0 ? user.form.map((res, i) => {
                      const cfg = res === 3 ? { t: 'Exact Score (3pt)', c: 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' }
                        : res === 1 ? { t: 'Outcome (1pt)', c: 'bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.6)]' }
                        : res === 0 ? { t: 'Miss (0pt)', c: 'bg-red-600 border border-red-800' }
                        : { t: 'No pick', c: 'bg-gray-600 border border-gray-500' };
                      return <span key={i} title={cfg.t} className={`w-3 h-3 md:w-4 md:h-4 rounded-full ${cfg.c}`}></span>;
                    }) : <span className="text-lg text-gray-600">-</span>}
                  </div>
                  <div className="col-span-1 text-center text-gray-300 bg-gray-900/40 py-1 rounded">{user.completedPicks}</div>
                  <div className="col-span-1 text-center text-green-400 bg-green-900/20 py-1 rounded">{user.exactMatches}</div>
                  <div className="col-span-1 text-center text-blue-400 bg-blue-900/20 py-1 rounded">{user.correctOutcomes}</div>
                  <div className={`col-span-2 text-center ${user.rank === 1 ? 'text-4xl md:text-5xl text-amber-300 font-black drop-shadow-[0_0_5px_rgba(212,175,55,0.5)]' : user.rank === 2 ? 'text-3xl md:text-4xl text-gray-300 drop-shadow-[0_0_4px_rgba(200,200,200,0.3)]' : user.rank === 3 ? 'text-3xl md:text-4xl text-amber-700 drop-shadow-[0_0_4px_rgba(160,80,0,0.3)]' : 'text-3xl md:text-4xl text-amber-400'}`}>{user.totalPoints}</div>

                  {/* points-behind progress bar (width = points relative to the leader) */}
                  {leaderPoints > 0 && (
                    <div
                      className={`left-0 bottom-0 h-1 ${user.rank === 1 ? 'bg-gradient-to-r from-[#D4AF37]/60 via-amber-400/40 to-transparent' : user.rank === 2 ? 'bg-gradient-to-r from-gray-400/40 to-transparent' : user.rank === 3 ? 'bg-gradient-to-r from-amber-700/40 to-transparent' : 'bg-gradient-to-r from-gray-600/20 to-transparent'}`}
                      style={{ position: 'absolute', width: `${Math.round(((user.totalPoints || 0) / leaderPoints) * 100)}%` }}
                      title={user.rank === 1 ? 'Leader' : `${leaderPoints - user.totalPoints} pts behind leader`}
                    ></div>
                  )}
                </div>
              ))}
            </div>

            {/* Stats summary bar */}
            {totalPicks > 0 && (
              <div className="mt-2 pt-3 border-t border-[#2a2a2a] flex flex-wrap justify-center gap-x-4 gap-y-1 font-oswald text-xs md:text-sm tracking-wider">
                <span className="text-[#555]">{totalPicks} <span className="text-[#444]">picks</span></span>
                <span className="text-[#444]">·</span>
                <span className="text-green-700">{totalExact} <span className="text-[#555]">exact</span></span>
                <span className="text-[#444]">·</span>
                <span className="text-blue-800">{totalOutcome} <span className="text-[#555]">correct</span></span>
                {bestPickers.length > 0 && (
                  <>
                    <span className="text-[#444]">·</span>
                    <span className="text-[#555]">most exact <span className="text-[#D4AF37]/70">{bestPickers.map(u => u.name).join(' & ')}</span></span>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  function UserPicksView({ users, predictions, setPredictions, realResults, koScoreMode }) {
    const [selectedUser, setSelectedUser] = useState(users[0]?.id || null);
    const [viewMode, setViewMode] = useState('tickets');
    const [playerSearch, setPlayerSearch] = useState('');
    // Inline edit state for a single ticket's scoreline.
    const [editingId, setEditingId] = useState(null);
    const [editS1, setEditS1] = useState('');
    const [editS2, setEditS2] = useState('');
    const [editPen, setEditPen] = useState(null);
    // Ticket density for the By Player view: 'cozy' (big tickets) or 'compact'.
    const [density, setDensity] = useState('cozy');

    const activeUser = users.find(u => u.id === selectedUser);
    const userPreds = predictions.filter(p => p.userId === selectedUser);
    const filteredUsers = users.filter(u => u.name.toLowerCase().includes(playerSearch.trim().toLowerCase()));
    const dupCount = findDuplicateGroups(predictions).length;

    const handleSearchKeyDown = (e) => {
      if (e.key === 'Enter' && filteredUsers.length > 0) {
        setSelectedUser(filteredUsers[0].id);
      }
    };

    const startEdit = (pred) => {
      setEditingId(pred.id);
      setEditS1(String(pred.score1));
      setEditS2(String(pred.score2));
      setEditPen(pred.penWinner || null);
    };
    const cancelEdit = () => setEditingId(null);
    const saveEdit = () => {
      if (editS1 === '' || editS2 === '') return;
      const s1n = parseInt(editS1, 10), s2n = parseInt(editS2, 10);
      const target = predictions.find(p => p.id === editingId);
      const koDraw = target && isKnockoutRound(target.round) && s1n === s2n;
      // A knockout draw must keep a pens winner; block save until one's chosen.
      if (koDraw && !editPen) return;
      setPredictions(prev => prev.map(p => {
        if (p.id !== editingId) return p;
        const next = { ...p, score1: s1n, score2: s2n, ts: Date.now(), edited: true };
        if (koDraw) next.penWinner = editPen;
        else delete next.penWinner;
        return next;
      }));
      setEditingId(null);
    };
    const deletePick = (pred) => {
      if (!window.confirm(`Delete ${pred.team1} ${pred.score1}-${pred.score2} ${pred.team2}?`)) return;
      setPredictions(prev => prev.filter(p => p.id !== pred.id));
      if (editingId === pred.id) setEditingId(null);
    };

    // Shared score editor (two inputs + a pens picker for knockout draws),
    // used by both the cozy card and the compact row.
    const scoreEditor = (pred) => (
      <>
        <div className="flex items-center gap-1 justify-center">
          <input type="number" min="0" value={editS1} autoFocus
            onChange={e => setEditS1(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') cancelEdit(); }}
            className="w-10 sm:w-12 bg-white border-2 border-[#1B4D3E] rounded text-center text-xl font-vt323 outline-none focus:border-[#D4AF37]" />
          <span className="text-gray-400 font-bold">-</span>
          <input type="number" min="0" value={editS2}
            onChange={e => setEditS2(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') cancelEdit(); }}
            className="w-10 sm:w-12 bg-white border-2 border-[#1B4D3E] rounded text-center text-xl font-vt323 outline-none focus:border-[#D4AF37]" />
        </div>
        {isKnockoutRound(pred.round) && editS1 !== '' && editS2 !== '' && parseInt(editS1, 10) === parseInt(editS2, 10) && (
          <div className="flex items-center gap-1 flex-wrap justify-center mt-1">
            <span className="text-[8px] font-bold uppercase tracking-widest text-gray-400">Pens</span>
            {['team1', 'team2'].map(side => (
              <button key={side} type="button" onClick={() => setEditPen(side)}
                className={`text-[10px] font-bold px-2 py-0.5 rounded-full border transition-all ${editPen === side ? 'bg-[#1B4D3E] text-white border-[#1B4D3E]' : 'bg-white text-gray-500 border-gray-300 hover:border-[#D4AF37]'}`}>
                {side === 'team1' ? pred.team1 : pred.team2}
              </button>
            ))}
          </div>
        )}
      </>
    );

    // Shared edit/delete (or save/cancel while editing) button cluster.
    const editControls = (pred) => (
      editingId === pred.id ? (
        <>
          <button onClick={saveEdit} title="Save" className="text-green-600 hover:text-green-800 bg-green-50 hover:bg-green-100 p-1.5 rounded"><Check size={16} /></button>
          <button onClick={cancelEdit} title="Cancel" className="text-gray-500 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 p-1.5 rounded"><X size={16} /></button>
        </>
      ) : (
        <>
          <button onClick={() => startEdit(pred)} title="Edit score" className="text-gray-400 hover:text-[#1B4D3E] bg-gray-50 hover:bg-gray-100 p-1.5 rounded"><Pencil size={14} /></button>
          <button onClick={() => deletePick(pred)} title="Delete pick" className="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-1.5 rounded"><Trash2 size={14} /></button>
        </>
      )
    );

    return (
      <div className="max-w-4xl mx-auto space-y-6 animate-in fade-in duration-300">

        {/* Control bar: view mode + (in tickets view) player search, grouped
            into one pill matching the leaderboard's settings treatment.
            Gold = which view you're looking at; green (the tabs below) = which
            player is selected. */}
        <div className="flex flex-wrap items-center gap-4 sm:gap-5 bg-gray-50 border-2 border-gray-200 rounded-2xl px-4 py-2.5">
          <div className="flex items-center gap-2 font-oswald">
            <span className="text-xs font-bold uppercase tracking-wider text-gray-500">View</span>
            <div className="flex gap-1">
              {[{ id: 'tickets', label: 'By Player' }, { id: 'matrix', label: 'Coverage Matrix' }, { id: 'duplicates', label: 'Duplicates' }].map(m => (
                <button
                  key={m.id}
                  onClick={() => setViewMode(m.id)}
                  className={`px-3 py-1.5 text-sm rounded-full font-bold tracking-wider transition-all flex items-center gap-1.5 ${
                    viewMode === m.id
                      ? 'bg-[#D4AF37] text-[#1B4D3E]'
                      : 'text-gray-500 hover:text-[#1B4D3E]'
                  }`}
                >
                  {m.label}
                  {m.id === 'duplicates' && dupCount > 0 && (
                    <span className="bg-red-500 text-white text-[10px] font-bold leading-none px-1.5 py-0.5 rounded-full">{dupCount}</span>
                  )}
                </button>
              ))}
            </div>
          </div>

          {viewMode === 'tickets' && (
            <>
              <div className="hidden sm:block w-px h-6 bg-gray-300"></div>
              <div className="flex items-center gap-2 font-oswald flex-1 min-w-[180px]">
                <label htmlFor="player-search" className="text-xs font-bold uppercase tracking-wider text-gray-500">Player</label>
                <div className="relative flex-1 max-w-xs">
                  <input
                    id="player-search"
                    type="text"
                    value={playerSearch}
                    onChange={(e) => setPlayerSearch(e.target.value)}
                    onKeyDown={handleSearchKeyDown}
                    placeholder="Search players…"
                    className="w-full bg-white border-2 border-gray-200 rounded-full pl-4 pr-9 py-1.5 text-sm font-oswald font-bold tracking-wide outline-none focus:border-[#D4AF37] text-gray-700"
                  />
                  {playerSearch && (
                    <button
                      onClick={() => setPlayerSearch('')}
                      title="Clear search"
                      className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-lg leading-none px-1"
                    >
                      ×
                    </button>
                  )}
                </div>
              </div>
            </>
          )}
        </div>

        {viewMode === 'matrix' && (
          <CoverageMatrixView users={users} predictions={predictions} realResults={realResults} />
        )}

        {viewMode === 'duplicates' && (
          <DuplicatesView users={users} predictions={predictions} setPredictions={setPredictions} />
        )}

        {viewMode === 'tickets' && (
        <>
        {/* Player Selector Tabs */}
        {filteredUsers.length > 0 ? (
          <div className="flex gap-2 overflow-x-auto pb-4 scrollbar-hide font-oswald">
            {filteredUsers.map(u => (
              <button
                key={u.id}
                onClick={() => setSelectedUser(u.id)}
                className={`px-5 py-2.5 rounded-full font-bold whitespace-nowrap tracking-wider transition-all shadow-sm ${
                  selectedUser === u.id
                    ? 'bg-[#1B4D3E] text-white border-2 border-[#1B4D3E]'
                    : 'bg-white text-gray-600 border-2 border-gray-200 hover:border-[#D4AF37] hover:text-[#1B4D3E]'
                }`}
              >
                {u.name}
              </button>
            ))}
          </div>
        ) : (
          <p className="text-gray-400 text-sm italic">No players match "{playerSearch}".</p>
        )}

        {/* Predictions List */}
        {activeUser && (
          <div className="bg-white p-6 shadow-lg rounded-lg border-2 border-[#e5e7eb]">
            <div className="flex justify-between items-center gap-3 flex-wrap mb-6 border-b border-gray-100 pb-4">
              <h2 className="text-2xl font-black font-oswald uppercase tracking-wide text-[#1B4D3E] flex items-center gap-2">
                <CheckCircle className="text-[#D4AF37]" />
                {activeUser.name}'s Match Tickets
              </h2>
              <div className="flex items-center gap-3">
                <div className="flex items-center bg-gray-100 rounded-full p-0.5 font-oswald">
                  {[{ id: 'cozy', label: 'Cozy', hint: 'Full-size tickets' }, { id: 'compact', label: 'Compact', hint: 'Dense one-line rows' }, { id: 'grid', label: 'Grid', hint: 'Points overview — exact scores highlighted' }].map(d => (
                    <button
                      key={d.id}
                      onClick={() => setDensity(d.id)}
                      title={d.hint}
                      className={`px-3 py-1 text-xs font-bold rounded-full transition-all ${density === d.id ? 'bg-[#1B4D3E] text-white shadow-sm' : 'text-gray-500 hover:text-[#1B4D3E]'}`}
                    >
                      {d.label}
                    </button>
                  ))}
                </div>
                <div className="bg-gray-100 text-gray-600 font-bold px-4 py-1.5 rounded-full text-sm whitespace-nowrap">
                  {userPreds.length} Tickets
                </div>
              </div>
            </div>

            {userPreds.length === 0 ? (
              <div className="flex justify-center items-center py-12 animate-in zoom-in-95">
                <div className="w-48 h-64 bg-[#f0eee9] border-4 border-dashed border-[#d1ccc0] flex flex-col justify-center items-center rounded-sm relative shadow-inner rotate-1">
                  <div className="absolute top-2 right-2 text-xs font-bold text-[#b8b3a5] bg-[#e1dcd0] px-2 py-0.5 rounded-full">#?</div>
                  <div className="text-6xl text-[#d1ccc0] opacity-50 mb-4 drop-shadow-sm">🏆</div>
                  <p className="text-center font-bold text-[#a09c8f] text-sm px-4 leading-tight">
                    No picks yet!<br/><span className="text-xs font-normal">Paste text to add predictions.</span>
                  </p>
                </div>
              </div>
            ) : density === 'compact' ? (
              <div className="border border-gray-100 rounded-lg divide-y divide-gray-100 overflow-hidden">
                {userPreds.map(pred => {
                  const real = realResults.find(r => sameFixture(pred, r));
                  const pts = calculatePoints(pred, real, koScoreMode);
                  const exact = real && pts === 3;
                  const editing = editingId === pred.id;
                  const accent = !real ? 'border-l-gray-200'
                    : pts === 3 ? 'border-l-[#D4AF37] bg-amber-50/60'
                    : pts === 1 ? 'border-l-blue-400'
                    : 'border-l-red-300';
                  return (
                    <div key={pred.id} className={`flex items-center gap-2 sm:gap-3 pl-2 pr-2 py-2 border-l-4 ${accent} ${editing ? 'bg-gray-50' : 'hover:bg-gray-50/70'} transition-colors`}>
                      {/* Result marker */}
                      <div className="w-9 shrink-0 flex justify-center">
                        {real ? (
                          exact
                            ? <Star size={18} className="text-[#D4AF37] fill-[#D4AF37]" title="Exact score (3pt)" />
                            : <span className={`text-xs font-black px-1.5 py-0.5 rounded ${pts === 1 ? 'text-blue-700 bg-blue-100' : 'text-red-500 bg-red-50'}`}>+{pts}</span>
                        ) : <span className="w-2 h-2 rounded-full bg-amber-300" title="Kickoff pending"></span>}
                      </div>
                      {/* Match */}
                      <div className="flex-1 min-w-0 flex items-center justify-center gap-1.5 text-sm">
                        <span className="shrink-0">{getFlagEmoji(pred.team1)}</span>
                        <span className={`font-bold truncate ${exact ? 'text-[#1B4D3E]' : 'text-gray-700'}`}>{pred.team1}</span>
                        {editing ? (
                          <div className="px-1 shrink-0">{scoreEditor(pred)}</div>
                        ) : (
                          <span className={`shrink-0 font-vt323 text-lg px-2 rounded ${exact ? 'bg-[#D4AF37] text-[#1B4D3E]' : 'bg-[#1B4D3E] text-white'}`}>{pred.score1}-{pred.score2}</span>
                        )}
                        <span className={`font-bold truncate ${exact ? 'text-[#1B4D3E]' : 'text-gray-700'}`}>{pred.team2}</span>
                        <span className="shrink-0">{getFlagEmoji(pred.team2)}</span>
                      </div>
                      {/* Meta */}
                      <div className="hidden sm:flex flex-col items-end text-right shrink-0 w-24 leading-tight">
                        <span className="text-[9px] font-bold uppercase tracking-wider text-gray-400 truncate w-full">{normalizeRound(pred.round)}</span>
                        {real ? (
                          <span className="text-[10px] font-bold text-gray-500 truncate w-full">act {real.score1}-{real.score2}{penWinnerTeam(real) ? ` · ${penWinnerTeam(real)} pk` : ''}</span>
                        ) : (
                          <span className="text-[9px] font-bold uppercase text-[#D4AF37]">pending</span>
                        )}
                      </div>
                      {/* Controls */}
                      <div className="flex items-center gap-1 shrink-0">{editControls(pred)}</div>
                    </div>
                  );
                })}
              </div>
            ) : density === 'grid' ? (
              <div className="grid grid-flow-dense grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2">
                {userPreds.map(pred => {
                  const real = realResults.find(r => sameFixture(pred, r));
                  const pts = calculatePoints(pred, real, koScoreMode);
                  const exact = real && pts === 3;
                  const editing = editingId === pred.id;
                  const tone = !real ? 'border-amber-200 bg-amber-50/40'
                    : pts === 3 ? 'border-[#D4AF37] ring-1 ring-[#D4AF37]/40 bg-gradient-to-b from-amber-50 to-white'
                    : pts === 1 ? 'border-blue-200 bg-blue-50/50'
                    : 'border-red-200 bg-red-50/40';
                  return (
                    <div
                      key={pred.id}
                      title={`${pred.team1} ${pred.score1}-${pred.score2} ${pred.team2}${penWinnerTeam(pred) ? ' (' + penWinnerTeam(pred) + ' pens)' : ''} · ${normalizeRound(pred.round)}`}
                      className={`relative group rounded-lg border p-2 flex flex-col items-center justify-center text-center min-h-[64px] ${tone} ${(exact || editing) ? 'col-span-2' : ''}`}
                    >
                      {editing ? (
                        <>
                          {scoreEditor(pred)}
                          <div className="flex gap-1 mt-1">{editControls(pred)}</div>
                        </>
                      ) : (
                        <>
                          <div className="absolute top-0.5 right-0.5 hidden group-hover:flex gap-0.5 bg-white/90 rounded shadow-sm">{editControls(pred)}</div>
                          {exact ? (
                            <>
                              <Star size={14} className="text-[#D4AF37] fill-[#D4AF37] mb-0.5" />
                              <div className="flex items-center justify-center gap-1 flex-wrap font-bold">
                                <span className="shrink-0">{getFlagEmoji(pred.team1)}</span>
                                <span className="bg-[#D4AF37] text-[#1B4D3E] font-vt323 text-lg px-1.5 rounded">{pred.score1}-{pred.score2}</span>
                                <span className="shrink-0">{getFlagEmoji(pred.team2)}</span>
                              </div>
                              <div className="text-[9px] font-bold uppercase tracking-wide text-gray-500 mt-0.5 truncate max-w-full">{pred.team1} v {pred.team2}</div>
                            </>
                          ) : real ? (
                            <>
                              <span className={`text-2xl font-black leading-none ${pts === 1 ? 'text-blue-600' : 'text-red-500'}`}>+{pts}</span>
                              <span className="text-[10px] font-vt323 text-gray-500 mt-1">{pred.score1}-{pred.score2}</span>
                            </>
                          ) : (
                            <>
                              <span className="font-vt323 text-lg text-[#1B4D3E]">{pred.score1}-{pred.score2}</span>
                              <span className="text-[8px] font-bold uppercase tracking-wide text-amber-600 mt-0.5">pending</span>
                            </>
                          )}
                        </>
                      )}
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="space-y-4">
                {userPreds.map(pred => {
                  const real = realResults.find(r => sameFixture(pred, r));
                  const pts = calculatePoints(pred, real, koScoreMode);

                  return (
                    <div key={pred.id} className={`vintage-ticket hover:-rotate-1 transition-transform duration-200 p-3 sm:p-4 border flex flex-wrap sm:flex-nowrap justify-center sm:justify-between items-center gap-2 sm:gap-4 ${real && pts === 3 ? 'border-[#D4AF37] ring-2 ring-[#D4AF37]/50 bg-gradient-to-b from-amber-50/70 to-white' : 'border-[#e5e7eb]'}`}>
                      {/* Home Team */}
                      <div className="flex-1 flex justify-end items-center gap-2 sm:gap-3 min-w-[100px]">
                        <span className="font-bold text-sm sm:text-lg text-right text-gray-800">{pred.team1}</span>
                        <span className="shrink-0 text-lg sm:text-3xl drop-shadow-sm">{getFlagEmoji(pred.team1)}</span>
                      </div>

                      {/* Score Box */}
                      <div className="flex flex-col items-center px-2 sm:px-4 w-28 sm:w-36 z-10">
                        <div className="text-[8px] sm:text-[9px] font-bold uppercase tracking-widest text-gray-400 mb-1 flex items-center gap-1">
                          {real && pts === 3 && <Star size={11} className="text-[#D4AF37] fill-[#D4AF37]" />}
                          {normalizeRound(pred.round)}
                        </div>
                        {editingId === pred.id ? scoreEditor(pred) : (
                          <>
                            <div className={`font-vt323 text-2xl sm:text-3xl px-3 sm:px-4 py-1 rounded shadow-inner tracking-widest w-full text-center ${real && pts === 3 ? 'bg-gradient-to-b from-[#D4AF37] to-amber-500 text-[#1B4D3E]' : 'bg-[#1B4D3E] text-white'}`}>
                              {pred.score1} - {pred.score2}
                            </div>
                            {isKnockoutRound(pred.round) && pred.score1 === pred.score2 && penWinnerTeam(pred) && (
                              <span className="text-[8px] sm:text-[9px] font-bold uppercase tracking-widest text-[#D4AF37] mt-1 text-center">{penWinnerTeam(pred)} pens</span>
                            )}
                          </>
                        )}
                        {real ? (
                          <div className="text-[10px] sm:text-xs text-gray-500 mt-1.5 font-bold uppercase tracking-wider text-center">
                            Actual: {real.score1}-{real.score2}
                            {penWinnerTeam(real) && <span className="block text-[#D4AF37]">{penWinnerTeam(real)} pens</span>}
                          </div>
                        ) : (
                          <div className="text-[9px] sm:text-[10px] text-[#D4AF37] mt-1.5 font-bold uppercase tracking-widest bg-amber-50 px-2 py-0.5 rounded text-center border border-amber-200">
                            Kickoff Pending
                          </div>
                        )}
                        {/* Edit / delete (or save / cancel while editing) */}
                        <div className="flex items-center gap-1 mt-2">{editControls(pred)}</div>
                      </div>

                      {/* Away Team */}
                      <div className="flex-1 flex justify-start items-center gap-2 sm:gap-3 min-w-[100px]">
                        <span className="shrink-0 text-lg sm:text-3xl drop-shadow-sm">{getFlagEmoji(pred.team2)}</span>
                        <span className="font-bold text-sm sm:text-lg text-gray-800">{pred.team2}</span>
                      </div>

                      {/* Points Result */}
                      <div className="w-auto sm:w-16 flex justify-end absolute sm:relative top-2 right-2 sm:top-auto sm:right-auto z-10">
                        {real && (
                          <span className={`font-black text-sm sm:text-lg px-2 sm:px-3 py-1 rounded-md shadow-sm border flex items-center gap-1 ${
                            pts === 3 ? 'bg-[#D4AF37] text-[#1B4D3E] border-amber-500' :
                            pts === 1 ? 'bg-blue-100 text-blue-700 border-blue-200' :
                            'bg-red-50 text-red-500 border-red-100'
                          }`}>
                            {pts === 3 && <Star size={12} className="fill-[#1B4D3E]" />}+{pts}
                          </span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
        </>
        )}
      </div>
    );
  }

  // Coverage Matrix: every player x every match they could've picked, so a
  // missing prediction (someone's guess never got pasted in) is easy to spot.
  function CoverageMatrixView({ users, predictions, realResults }) {
    const matches = useMemo(() => {
      const map = {};
      predictions.forEach(p => {
        const round = normalizeRound(p.round);
        const key = normalizeTeamName(p.team1) + '_' + normalizeTeamName(p.team2) + '_' + round;
        if (!map[key]) map[key] = { team1: p.team1, team2: p.team2, round };
      });
      // Attach the official match date (if the result's been logged yet) so
      // we can order chronologically; undated (not-yet-played) matches sort last.
      Object.values(map).forEach(m => {
        const real = realResults.find(r => sameFixture(m, r));
        m.date = real ? real.date : null;
      });
      const roundIndex = (r) => { const i = ROUNDS.indexOf(r); return i === -1 ? ROUNDS.length : i; };
      return Object.values(map).sort((a, b) => {
        if (a.date && b.date) return a.date.localeCompare(b.date);
        if (a.date) return -1;
        if (b.date) return 1;
        const ri = roundIndex(a.round) - roundIndex(b.round);
        if (ri !== 0) return ri;
        return a.team1.localeCompare(b.team1);
      });
    }, [predictions, realResults]);

    const findPick = (userId, match) => predictions.find(p => p.userId === userId && sameFixture(p, match));

    const missingCount = (userId) => matches.filter(m => !findPick(userId, m)).length;

    if (matches.length === 0) {
      return (
        <div className="text-center text-gray-400 italic py-12 bg-white rounded-lg border-2 border-gray-200">
          No predictions pasted in yet — nothing to check.
        </div>
      );
    }

    return (
      <div className="bg-white rounded-lg border-2 border-[#e5e7eb] shadow-lg overflow-x-auto">
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr className="bg-[#1B4D3E] text-white font-oswald uppercase tracking-wide text-xs">
              <th className="text-left p-3 sticky left-0 bg-[#1B4D3E] z-10 whitespace-nowrap">Match</th>
              {users.map(u => (
                <th key={u.id} className="p-3 text-center whitespace-nowrap">
                  {u.name}
                  {missingCount(u.id) > 0 && (
                    <span className="block text-[10px] font-bold text-red-300 normal-case tracking-normal">{missingCount(u.id)} missing</span>
                  )}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {matches.map((m, i) => {
              const rowBg = i % 2 === 0 ? 'bg-gray-50' : 'bg-white';
              return (
                <tr key={i} className={rowBg}>
                  <td className={`p-2 px-3 font-bold text-gray-700 whitespace-nowrap sticky left-0 ${rowBg}`}>
                    <div>{m.team1} <span className="text-gray-400 font-normal">vs</span> {m.team2}</div>
                    <div className="text-[10px] font-normal uppercase tracking-wider text-gray-400">
                      {m.round} · {m.date ? formatDay(m.date) : <span className="text-[#D4AF37]">Kickoff Pending</span>}
                    </div>
                  </td>
                  {users.map(u => {
                    const pick = findPick(u.id, m);
                    return (
                      <td key={u.id} className="p-2 text-center">
                        {pick ? (
                          <span className="font-vt323 text-base bg-green-100 text-green-700 px-2 py-0.5 rounded">{pick.score1}-{pick.score2}</span>
                        ) : (
                          <span className="font-bold text-[10px] uppercase tracking-wider text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded">Missing</span>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  }

  // Duplicate check: surfaces any player who has more than one prediction for
  // the same match, so accidental double-pastes can be deleted down to one.

  function PredictionsView({ users, setUsers, predictions, setPredictions }) {
    // Most-recently added or edited picks, newest first — a running log so you

    const userName = (id) => (users.find(u => u.id === id) || {}).name || 'Unknown';
    const recentPicks = predictions
      .filter(p => p.ts)

    const [selectedUserId, setSelectedUserId] = useState(users[0]?.id || '');
    const [newUserName, setNewUserName] = useState('');
    const [rawText, setRawText] = useState('');
    const [parsedResults, setParsedResults] = useState([]);
    const [selectedRound, setSelectedRound] = useState('Group Stage');
    // For a knockout draw prediction we also need who the player thinks wins on
    // pens; keyed by the parsed result's index ('team1' | 'team2').
    const [penPicks, setPenPicks] = useState({});

    const selectedRoundIsKO = isKnockoutRound(selectedRound);

    // Real-time parsing logic
    useEffect(() => {
      setPenPicks({});
      if (!rawText.trim()) {
        setParsedResults([]);
        return;
      }

      let cleanText = rawText.replace(/(\d)(\d\.)/g, '$1 $2');
      cleanText = cleanText.replace(/(\d)([\p{L}])/gu, '$1 $2');
      // Team separator: either a "vs" token (v / vs / v.s. / versus, whitespace-
      // bounded) OR a dash (e.g. "Austria - Jordan"). Scores follow, dash/space
      // separated. Teams are letters/spaces (\p{L} so accented names like
      // "Curaçao" parse too); scores are digits.
      const regex = /([\p{L}][\p{L}\s]*?)(?:\s+(?:v\.?\s*s\.?|versus)\s+|\s*[-–—]\s*)([\p{L}][\p{L}\s]*?)[\s\-–—]+(\d+)[\s\-–—]+(\d+)/giu;

      const results = [];
      let match;
      while ((match = regex.exec(cleanText)) !== null) {
        let team1 = match[1].trim();
        let team2 = match[2].trim();
        team1 = team1.replace(/^[\d.\s]+/, '');

        results.push({
          team1,
          team2,
          score1: parseInt(match[3], 10),
          score2: parseInt(match[4], 10)
        });
      }
      setParsedResults(results);
    }, [rawText]);

    const handleAddUser = (e) => {

          id: `p${Date.now()}_${Math.random()}`,

          ts: Date.now(),
          ...p
        };
        if (selectedRoundIsKO && p.score1 === p.score2) pred.penWinner = penPicks[i];
        return pred;
      });
      setPredictions(prev => [...prev, ...newPreds]);
      setRawText('');
      alert("Picks saved successfully!");

    const loadDemoText = () => {

            <div className="flex-1">

              <select

                  value={newUserName}
                  onChange={(e) => setNewUserName(e.target.value)}
                />
                <button type="submit" className="bg-[#1B4D3E] text-white p-2 rounded hover:bg-[#143a2e] transition-colors">
                  <Plus size={20} />
                </button>
              </form>
            </div>
          </div>

          {/* Text Area */}
          <div className="mb-4 relative">
            <div className="flex justify-between items-end mb-2">
              <label className="block text-sm font-bold text-gray-700">Scout's Notebook (Paste Chat Message)</label>
              <button onClick={loadDemoText} className="text-xs text-[#D4AF37] font-bold underline hover:text-amber-600">

          {/* Live Preview */}

            <div className="mt-6 bg-[#f9f9f9] p-4 rounded-lg border border-dashed border-gray-300">
              <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                <CheckCircle size={16} className="text-green-500" /> Parsed Ticket Preview
                <span className="text-[#D4AF37] normal-case font-normal">· saving as {selectedRound}</span>
              </h3>

              {parsedResults.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                  {parsedResults.map((p, i) => {
                    const isDraw = p.score1 === p.score2;
                    const needsPen = selectedRoundIsKO && isDraw;
                    return (
                    <div key={i} className="bg-white p-3 rounded shadow-sm border border-gray-200">
                      <div className="flex justify-between items-center">
                        <span className="font-bold flex items-center gap-2">
                          {getFlagEmoji(p.team1)} {p.team1}
                        </span>
                        <span className="bg-[#1B4D3E] text-white font-vt323 text-xl px-3 py-1 rounded">
                          {p.score1} - {p.score2}
                        </span>
                        <span className="font-bold flex items-center gap-2">
                          {p.team2} {getFlagEmoji(p.team2)}
                        </span>
                      </div>
                      {needsPen && (
                        <div className="mt-2 pt-2 border-t border-dashed border-gray-200 flex items-center justify-center gap-2 flex-wrap">

                          {['team1', 'team2'].map(side => (
                            <button
                              key={side}
                              type="button"
                              onClick={() => setPenPicks(prev => ({ ...prev, [i]: side }))}
                              className={`text-xs font-bold px-3 py-1 rounded-full border-2 transition-all ${
                                penPicks[i] === side
                                  ? 'bg-[#1B4D3E] text-white border-[#1B4D3E]'
                                  : 'bg-white text-gray-500 border-gray-200 hover:border-[#D4AF37]'
                              }`}
                            >
                              {side === 'team1' ? p.team1 : p.team2}
                            </button>
                          ))}

                      )}
                    </div>
                    );
                  })}

              ) : (
                <div className="text-center text-gray-400 py-4 flex flex-col items-center gap-2">
                  <ShieldAlert size={24} />

                  <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full shrink-0 ${

  function AdminView({ realResults, setRealResults, predictions }) {
    const [t1, setT1] = useState('');
    const [t2, setT2] = useState('');
    const [s1, setS1] = useState('');
    const [s2, setS2] = useState('');
    const [date, setDate] = useState(todayStr());
    const [round, setRound] = useState('Group Stage');
    const [penWinner, setPenWinner] = useState(null);
    const score1Ref = useRef(null);

    // A knockout tie level at 120 min is settled on pens, so we need the winner.
    const resultNeedsPen = isKnockoutRound(round) && s1 !== '' && s2 !== '' && parseInt(s1, 10) === parseInt(s2, 10);

    // Crowd Consensus cards are clickable: fill in the teams/round below
    // instead of retyping them, then jump straight to the score inputs.
    const fillResultForm = (m) => {
      setT1(m.team1);
      setT2(m.team2);
      setRound(m.round);
      setPenWinner(null);
      score1Ref.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      score1Ref.current?.focus();
    };

    const upcomingMatches = useMemo(() => {
      const matchMap = {};
      predictions.forEach(p => {
        const isFinished = realResults.some(r => sameFixture(p, r));

        if (!isFinished) {
          const pRound = normalizeRound(p.round);
          const key = `${normalizeTeamName(p.team1)}_${normalizeTeamName(p.team2)}_${pRound}`;
          if (!matchMap[key]) matchMap[key] = { team1: p.team1, team2: p.team2, round: pRound, h:0, d:0, a:0, total:0, scores: {} };
          matchMap[key].total++;
          if (p.score1 > p.score2) matchMap[key].h++;
          else if (p.score1 < p.score2) matchMap[key].a++;
          else matchMap[key].d++;
          const scoreKey = `${p.score1}-${p.score2}`;
          matchMap[key].scores[scoreKey] = (matchMap[key].scores[scoreKey] || 0) + 1;
        }
      });
      // Surface every exact scoreline the crowd picked, most-popular first
      // (ties broken by whichever was seen first), alongside the win/draw/win split.
      return Object.values(matchMap).map(m => {
        const scoreEntries = Object.entries(m.scores).sort((a, b) => b[1] - a[1]);
        return { ...m, scoreEntries };
      }).sort((a,b) => b.total - a.total);
    }, [predictions, realResults]);

    const handleAddResult = (e) => {
      e.preventDefault();
      if (!t1 || !t2 || s1 === '' || s2 === '' || !date) return;
      if (resultNeedsPen && !penWinner) return;

      const newResult = {
        id: `r${Date.now()}`,
        date,
        round,
        team1: t1.trim(),
        team2: t2.trim(),
        score1: parseInt(s1, 10),
        score2: parseInt(s2, 10)
      };
      if (resultNeedsPen) newResult.penWinner = penWinner;

      // Only replaces a result for the same team pair AND round (fixing a
      // typo on that match) — a different round with the same two teams
      // (a rematch) is a separate fixture and must not be overwritten.
      const filtered = realResults.filter(r => !sameFixture(r, newResult));

      setRealResults([...filtered, newResult]);
      setT1(''); setT2(''); setS1(''); setS2(''); setPenWinner(null);
    };

    const removeResult = (id) => {
      setRealResults(realResults.filter(r => r.id !== id));
    };

    // Group logged results into matchdays (by date) for the History Books.
    const dayGroups = [...realResults]
      .sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.id.localeCompare(b.id))
      .reduce((acc, r) => {
        const d = r.date || 'Undated';
        (acc[d] = acc[d] || []).push(r);
        return acc;
      }, {});
    const orderedDays = Object.keys(dayGroups).sort();

    return (
      <div className="max-w-4xl mx-auto space-y-8 animate-in fade-in duration-300">

        {/* Community Consensus */}
        <div className="bg-white p-6 shadow-lg rounded-lg border-2 border-gray-200">
          <h2 className="text-2xl font-black font-oswald uppercase tracking-wide text-[#1B4D3E] mb-6 flex items-center gap-2">
            <Users /> Crowd Consensus (Upcoming Matches)
          </h2>

          {upcomingMatches.length > 0 ? (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {upcomingMatches.map((m, idx) => {
                const hPct = Math.round((m.h / m.total) * 100);
                const dPct = Math.round((m.d / m.total) * 100);
                const aPct = Math.round((m.a / m.total) * 100);

                return (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => fillResultForm(m)}
                    title="Fill in the result form below with these teams"
                    className="text-left bg-gray-50 border border-gray-200 p-4 rounded shadow-sm cursor-pointer hover:border-[#D4AF37] hover:shadow-md hover:bg-amber-50/40 transition-all w-full"
                  >
                    <div className="flex justify-between items-center mb-2 font-bold text-lg">
                      <span className="flex items-center gap-2 text-gray-800">{getFlagEmoji(m.team1)} {m.team1}</span>
                      <span className="text-gray-400 text-sm">vs</span>
                      <span className="flex items-center gap-2 text-gray-800">{m.team2} {getFlagEmoji(m.team2)}</span>
                    </div>

                    {m.scoreEntries.length > 0 && (
                      <div className="flex flex-wrap justify-center gap-1.5 mb-2">
                        {m.scoreEntries.slice(0, 3).map(([score, count]) => (
                          <span key={score} className="inline-flex items-center gap-1 bg-[#1B4D3E]/5 border border-[#1B4D3E]/20 text-[#1B4D3E] text-xs font-bold px-2 py-0.5 rounded-full">
                            {score} <span className="text-gray-400 font-normal">×{count}</span>
                          </span>
                        ))}
                        {m.scoreEntries.length > 3 && (
                          <span className="inline-flex items-center text-xs font-bold text-gray-400 px-1.5 py-0.5">
                            +{m.scoreEntries.length - 3} more
                          </span>
                        )}
                      </div>
                    )}

                    <div className="text-center text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-2">{m.round} <span className="text-[#D4AF37]">· click to log result</span></div>

                    {/* Split Bar */}
                    <div className="w-full h-3 bg-gray-200 rounded-full flex overflow-hidden mb-2">
                      {hPct > 0 && <div style={{ width: `${hPct}%` }} className="bg-green-500"></div>}
                      {dPct > 0 && <div style={{ width: `${dPct}%` }} className="bg-gray-400"></div>}
                      {aPct > 0 && <div style={{ width: `${aPct}%` }} className="bg-blue-500"></div>}
                    </div>

                    <div className="flex justify-between text-xs font-bold text-gray-500">
                      <span className="text-green-600">{hPct}% Win</span>
                      {dPct > 0 && <span>{dPct}% Draw</span>}
                      <span className="text-blue-600">{aPct}% Win</span>
                    </div>
                  </button>
                )
              })}
            </div>
          ) : (
            <p className="text-gray-500 text-sm italic">No upcoming matches with predictions found. Go paste some picks!</p>
          )}
        </div>

        <div className="bg-white p-6 shadow-lg rounded-lg border-2 border-gray-200">
          <h2 className="text-2xl font-black font-oswald uppercase tracking-wide text-[#1B4D3E] mb-6 flex items-center gap-2">
            <Award /> Official Match Referees Panel
          </h2>

          <form onSubmit={handleAddResult} className="scout-ledger p-6 rounded-lg border-2 border-gray-300 shadow-inner mb-8 relative overflow-hidden">
             {/* Ledger Margin Line */}
             <div className="absolute top-0 bottom-0 left-10 w-0.5 bg-red-400/50 z-10 pointer-events-none"></div>

             <h3 className="text-lg font-caveat font-bold text-gray-500 mb-4 ml-8 tracking-wider">Log Official Full Time Score</h3>
             <div className="flex items-center gap-3 mb-4 pl-8 relative z-20 flex-wrap">
              <label className="font-oswald uppercase tracking-widest text-xs font-bold text-gray-500">Match Day</label>
              <input
                type="date" value={date} onChange={e => setDate(e.target.value)} required
                className="p-2 bg-white/70 border-2 border-gray-400 rounded font-caveat text-lg font-bold text-gray-700 outline-none focus:border-[#D4AF37]"
              />
              <label className="font-oswald uppercase tracking-widest text-xs font-bold text-gray-500 ml-2">Round</label>
              <select
                value={round} onChange={e => setRound(e.target.value)}
                title="Lets the same two teams meeting twice (e.g. group stage, then a knockout rematch) be logged as separate matches"
                className="p-2 bg-white/70 border-2 border-gray-400 rounded font-caveat text-lg font-bold text-gray-700 outline-none focus:border-[#D4AF37]"
              >
                {ROUNDS.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
             </div>
             <div className="flex flex-col md:flex-row items-center gap-4 relative z-20 pl-8">
              <input
                type="text" placeholder="Home Team (e.g. France)"
                className="flex-1 w-full p-2 bg-transparent border-b-2 border-gray-400 border-dashed text-center outline-none focus:border-[#1B4D3E] font-caveat text-2xl font-bold"
                value={t1} onChange={e => setT1(e.target.value)} required
              />

              <div className="flex gap-2 items-center">
                <input
                  ref={score1Ref}
                  type="number" min="0" placeholder="0"
                  className="w-16 p-2 bg-white/50 border-2 border-gray-400 rounded text-center text-3xl font-caveat font-bold outline-none focus:border-[#D4AF37]"
                  value={s1} onChange={e => setS1(e.target.value)} required
                />
                <span className="text-gray-400 font-bold font-caveat text-2xl">-</span>
                <input
                  type="number" min="0" placeholder="0"
                  className="w-16 p-2 bg-white/50 border-2 border-gray-400 rounded text-center text-3xl font-caveat font-bold outline-none focus:border-[#D4AF37]"
                  value={s2} onChange={e => setS2(e.target.value)} required
                />
              </div>

              <input
                type="text" placeholder="Away Team (e.g. Senegal)"
                className="flex-1 w-full p-2 bg-transparent border-b-2 border-gray-400 border-dashed text-center outline-none focus:border-[#1B4D3E] font-caveat text-2xl font-bold"
                value={t2} onChange={e => setT2(e.target.value)} required
              />

              <button type="submit" className="w-full md:w-auto bg-[#1B4D3E] text-white px-6 py-2 rounded font-oswald uppercase tracking-widest hover:bg-[#143a2e] transition-colors shadow-md mt-2 md:mt-0">
                Save
              </button>
            </div>

            {resultNeedsPen && (
              <div className="flex items-center gap-3 mt-4 pl-8 relative z-20 flex-wrap">
                <label className="font-oswald uppercase tracking-widest text-xs font-bold text-gray-500">Wins on penalties</label>
                {[{ side: 'team1', name: t1 }, { side: 'team2', name: t2 }].map(({ side, name }) => (
                  <button
                    key={side}
                    type="button"
                    onClick={() => setPenWinner(side)}
                    className={`font-caveat text-lg font-bold px-4 py-1 rounded-full border-2 transition-all ${
                      penWinner === side
                        ? 'bg-[#1B4D3E] text-white border-[#1B4D3E]'
                        : 'bg-white/70 text-gray-600 border-gray-400 hover:border-[#D4AF37]'
                    }`}
                  >
                    {name || (side === 'team1' ? 'Home' : 'Away')}
                  </button>
                ))}
              </div>
            )}
          </form>

          <div>
            <h3 className="text-xl font-bold font-oswald text-gray-800 mb-4 border-b pb-2 uppercase tracking-wide">History Books (Official Results)</h3>

            {realResults.length === 0 ? (
              <div className="py-8 text-center text-gray-500 italic">
                The tournament hasn't started yet. No official results logged.
              </div>
            ) : (
              orderedDays.map((day, dayIdx) => (
                <div key={day} className="mb-6">
                  <div className="flex items-center gap-3 mb-3 mt-2">
                    <span className="bg-[#1B4D3E] text-[#D4AF37] font-oswald font-black uppercase tracking-widest text-xs px-3 py-1 rounded shadow-sm whitespace-nowrap">
                      Matchday {dayIdx + 1}
                    </span>
                    <span className="font-caveat text-xl font-bold text-gray-600 whitespace-nowrap">{formatDay(day)}</span>
                    <span className="text-xs text-gray-400 font-bold">{dayGroups[day].length} match{dayGroups[day].length === 1 ? '' : 'es'}</span>
                    <div className="flex-1 h-px bg-gray-200"></div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-4">
                    {dayGroups[day].map(r => (
                      <div key={r.id} className="relative flex justify-between items-center bg-gray-50 border border-gray-200 p-4 rounded shadow-sm hover:shadow-md transition-shadow">
                        <div className="flex-1 font-bold flex items-center justify-end gap-2 text-right text-gray-800 min-w-0">
                          <span className="truncate">{r.team1}</span> <span className="shrink-0 text-2xl">{getFlagEmoji(r.team1)}</span>
                        </div>

                        <div className="flex flex-col items-center mx-2">
                          <span className="text-[9px] font-bold uppercase tracking-wider text-gray-400 mb-1">{normalizeRound(r.round)}</span>
                          <div className="px-4 bg-black text-white font-vt323 text-3xl py-1 rounded shadow-inner">
                            {r.score1} - {r.score2}
                          </div>
                          {penWinnerTeam(r) && (
                            <span className="text-[9px] font-bold uppercase tracking-wider text-[#D4AF37] mt-1 text-center">
                              {penWinnerTeam(r)} win on pens
                            </span>
                          )}
                        </div>

                        <div className="flex-1 font-bold flex items-center gap-2 text-gray-800 min-w-0">
                          <span className="shrink-0 text-2xl">{getFlagEmoji(r.team2)}</span> <span className="truncate">{r.team2}</span>
                        </div>

                        <button
                          onClick={() => removeResult(r.id)}
                          className="ml-4 text-red-400 hover:text-red-600 font-bold text-sm bg-red-50 hover:bg-red-100 p-2 rounded"
                        >
                          Delete
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      </div>
    );
  }

  function FeedbackView() {
    const [submitted, setSubmitted] = useState(false);
    const [rating, setRating] = useState(null);

    if (submitted) {
      return (
        <div className="max-w-lg mx-auto animate-in fade-in duration-300">
          <div className="bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden">
            <div className="p-4 border-b border-gray-100">
              <h2 className="font-oswald text-lg font-bold text-[#1B4D3E] uppercase tracking-wide">GOTTEM</h2>
            </div>
            <div className="relative w-full" style={{ paddingBottom: '56.25%' }}>
              <iframe
                className="absolute inset-0 w-full h-full"
                src="https://www.youtube-nocookie.com/embed/B1BnKd7RrjE?autoplay=1"
                title="Gottem"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowFullScreen
              />
            </div>
          </div>
        </div>
      );
    }

    return (
      <div className="max-w-lg mx-auto animate-in fade-in duration-300">
        <div className="bg-white rounded-2xl shadow-md border border-gray-200 p-8 space-y-6">
          <div>
            <h2 className="font-oswald text-2xl font-bold text-[#1B4D3E] uppercase tracking-wide">Share your feedback</h2>
            <p className="text-gray-500 text-sm mt-1">Help us improve the experience. All feedback is welcome.</p>
          </div>

          <div className="space-y-4">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Your name</label>
              <input type="text" placeholder="e.g. Kross" className="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1B4D3E]/30" />
            </div>

            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">How would you rate this?</label>
              <div className="flex gap-2">
                {['😫','😕','😐','😊','🤩'].map((emoji, i) => (
                  <label
                    key={i}
                    className={`flex-1 flex flex-col items-center gap-1 cursor-pointer py-2 rounded-lg border-2 transition-all ${
                      rating === i + 1
                        ? 'bg-[#1B4D3E]/10 border-[#1B4D3E] scale-110 shadow-sm'
                        : 'border-transparent hover:bg-gray-50 hover:scale-105'
                    }`}
                  >
                    <input
                      type="radio"
                      name="rating"
                      value={i + 1}
                      checked={rating === i + 1}
                      onChange={() => setRating(i + 1)}
                      className="sr-only"
                    />
                    <span className="text-2xl select-none">{emoji}</span>
                    <span className={`text-[10px] ${rating === i + 1 ? 'text-[#1B4D3E] font-bold' : 'text-gray-400'}`}>{i + 1}</span>
                  </label>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Any suggestions?</label>
              <textarea rows={4} placeholder="What would make this better?" className="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1B4D3E]/30 resize-none" />
            </div>
          </div>

          <button
            onClick={() => setSubmitted(true)}
            className="flex items-center justify-center gap-2 w-full bg-[#1B4D3E] hover:bg-[#163d31] text-white font-oswald font-bold uppercase tracking-widest py-3 rounded-xl transition-colors shadow-sm text-sm"
          >
            Submit Feedback
          </button>
        </div>
      </div>
    );
  }

  function BackupView({ users, setUsers, predictions, setPredictions, realResults, setRealResults }) {
    const fileInputRef = useRef(null);

    const handleExport = () => {
      const data = { users, predictions, realResults };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `texaus-wc2026-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    const handleImport = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.users && data.predictions && data.realResults) {
            setUsers(data.users);
            setPredictions(data.predictions);
            setRealResults(data.realResults);
            alert("Tournament data imported successfully!");
          } else {
            alert("Invalid file format. Ensure it's a backup file from this app.");
          }
        } catch (err) {
          alert("Error reading file.");
        }
      };
      reader.readAsText(file);
      if (fileInputRef.current) fileInputRef.current.value = '';
    };

    return (
      <div className="max-w-4xl mx-auto space-y-8 animate-in fade-in duration-300">
        <div className="bg-white p-6 shadow-lg rounded-lg border-2 border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
          <div>
            <h2 className="text-xl font-black font-oswald tracking-wide text-[#1B4D3E] flex items-center gap-2 mb-1">
              <Save /> Backup & Restore
            </h2>
            <p className="text-sm text-gray-500">Import or export your entire tournament's predictions and results.</p>
          </div>

          <div className="flex gap-3 w-full md:w-auto">
            <input
              type="file"
              accept=".json"
              ref={fileInputRef}
              onChange={handleImport}
              className="hidden"
            />
            <button
              onClick={() => fileInputRef.current?.click()}
              className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-gray-100 text-gray-700 px-4 py-2 rounded font-bold hover:bg-gray-200 transition-colors border border-gray-300 shadow-sm"
            >
              <Upload size={18} /> Import Data
            </button>

            <button
              onClick={handleExport}
              className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-[#D4AF37] text-[#1B4D3E] px-4 py-2 rounded font-oswald uppercase tracking-wider hover:bg-amber-400 transition-colors shadow-sm"
            >
              <Download size={18} /> Export JSON
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ---- mount the app ---- */
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
