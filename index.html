<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TexAus World Cup 2026 Predictions</title>

  <!--
    NO-BUILD RUNNER
    ----------------
    This file runs the React component with zero install — just open it.
    It pulls four libraries from CDNs (needs an internet connection):
      1. Tailwind  (the utility classes used everywhere)
      2. React + ReactDOM
      3. lucide (the icon data), exposed as the global `lucide`. We build the
         icons into React components ourselves — the `lucide-react` UMD build
         does not expose its icons usably, but the vanilla `lucide` UMD does.
      4. Babel standalone, which compiles the JSX in your browser at load time

    The whole app lives in this single file. The two `import` lines a normal
    React project would use are replaced by the "wiring" block below (pulling
    React hooks off the global, and building the lucide icons into components),
    plus a render call at the very bottom.

    Heads-up: this app keeps data only in memory (it resets on refresh). Use the
    Backup tab (Export / Import JSON) to save and restore a tournament.
  -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/lucide@0.379.0/dist/umd/lucide.js"></script>
  <!-- DOM-to-image export. Renders via SVG <foreignObject> so it handles modern
       CSS (oklch colors, gradients, blend modes) that html2canvas chokes on. -->
  <script crossorigin src="https://unpkg.com/html-to-image@1.11.13/dist/html-to-image.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style> html, body, #root { min-height: 100%; margin: 0; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
  /* ---- wiring: replaces the two `import` lines from App.jsx ---- */
  const { useState, useEffect, useMemo, useRef } = React;

  // The lucide icons. The vanilla `lucide` UMD exposes every icon as an SVG
  // node array like ["svg", attrs, [ ["path", {d:"..."}], ... ]]. We turn that
  // into a small React component so the existing <Trophy size=.. className=.. />
  // call sites work unchanged. Any missing icon degrades to a harmless no-op.
  const _toCamel = (k) => k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  function _renderNode(node, key) {
    const tag = node[0], attrs = node[1] || {}, children = node[2] || [];
    const props = { key };
    for (const k in attrs) props[_toCamel(k)] = attrs[k];
    const kids = children.map((c, i) => _renderNode(c, i));
    return React.createElement(tag, props, kids.length ? kids : undefined);
  }
  function _makeIcon(name) {
    const node = window.lucide && window.lucide[name];
    if (!node) return () => null;
    const baseAttrs = node[1] || {}, children = node[2] || [];
    return function LucideIcon(props) {
      props = props || {};
      const svgProps = {};
      for (const k in baseAttrs) svgProps[_toCamel(k)] = baseAttrs[k];
      if (props.size != null) { svgProps.width = props.size; svgProps.height = props.size; }
      if (props.className) svgProps.className = props.className;
      if (props.style) svgProps.style = props.style;
      svgProps['aria-hidden'] = 'true';
      return React.createElement('svg', svgProps, children.map((c, i) => _renderNode(c, i)));
    };
  }
  const Trophy = _makeIcon('Trophy'), Plus = _makeIcon('Plus'), Save = _makeIcon('Save'),
    Activity = _makeIcon('Activity'), CheckCircle = _makeIcon('CheckCircle'),
    ShieldAlert = _makeIcon('ShieldAlert'), Award = _makeIcon('Award'), Star = _makeIcon('Star'),
    Download = _makeIcon('Download'), Upload = _makeIcon('Upload'), Crown = _makeIcon('Crown'),
    Medal = _makeIcon('Medal'), Users = _makeIcon('Users'),
    Pencil = _makeIcon('Pencil'), Trash2 = _makeIcon('Trash2'), Check = _makeIcon('Check'), X = _makeIcon('X');

  // --- CSS Enhancements (Foil, Fonts, Tickets, Ledger, Metal) ---
  const customStyles = `
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Oswald:wght@400;700&family=VT323&display=swap');

    /* Typography Classes */
    .font-oswald { font-family: 'Oswald', sans-serif; }
    .font-vt323 { font-family: 'VT323', monospace; letter-spacing: 1px; }
    .font-caveat { font-family: 'Caveat', cursive; }

    /* Holographic Foil */
    @keyframes foil-shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .foil-card {
      position: relative;
      overflow: hidden;
      border-color: #D4AF37 !important;
    }
    .foil-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255, 215, 0, 0.4) 25%,
        rgba(255, 255, 255, 0.8) 30%,
        rgba(255, 215, 0, 0.4) 35%,
        transparent 40%
      );
      background-size: 200% auto;
      animation: foil-shimmer 3s infinite linear;
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: color-dodge;
    }

    /* Perforated Vintage Ticket */
    .vintage-ticket {
      position: relative;
      background-color: #fff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .vintage-ticket::before, .vintage-ticket::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 14px;
      background-image: radial-gradient(circle at center, #FDFBF7 5px, transparent 6px);
      background-size: 100% 18px;
      z-index: 10;
    }
    .vintage-ticket::before { left: -7px; }
    .vintage-ticket::after { right: -7px; }

    /* Metallic Podium Texture */
    .metal-texture {
      position: relative;
      overflow: hidden;
    }
    .metal-texture::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 5;
    }

    /* Scout Ledger Textarea */
    .scout-ledger {
      background-color: #f4f1ea;
      background-image: repeating-linear-gradient(transparent, transparent 31px, #a3c4f3 31px, #a3c4f3 32px);
      line-height: 32px;
      padding-top: 6px;
      color: #0b1f38;
    }

    /* Leaderboard: holographic sheen for the #1 row (reuses foil-shimmer) */
    .leader-foil { position: relative; overflow: hidden; }
    .leader-foil::after {
      content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(105deg, transparent 18%, rgba(255,215,0,0.25) 24%, rgba(255,255,255,0.55) 30%, rgba(255,215,0,0.25) 36%, transparent 42%);
      background-size: 200% auto;
      animation: foil-shimmer 3.2s infinite linear;
      mix-blend-mode: screen;
    }
    .leader-foil > * { position: relative; z-index: 2; }

    /* Bobbing crown for the current leader */
    @keyframes crown-bob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-3px) rotate(6deg); } }
    .leader-crown { animation: crown-bob 1.8s ease-in-out infinite; transform-origin: center bottom; }
  `;

  // --- Helper Functions ---
  // Strips accents first (so "Curaçao" and "Curacao" normalize to the same
  // key) before lowercasing and dropping anything that isn't a letter.
  const normalizeTeamName = (name) => {
    return name.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().replace(/[^a-z]/g, '');
  };

  // Tournament stages, in chronological order.
  const ROUNDS = ['Group Stage', 'Round of 32', 'Round of 16', 'Quarterfinal', 'Semifinal', 'Third Place Play-off', 'Final'];
  // A prediction/result with no round set predates this field — treat it as
  // Group Stage so old/imported data keeps matching exactly as before.
  const normalizeRound = (round) => round || 'Group Stage';
  // Every round except the group stage is a knockout — a level score there is
  // settled by a penalty shootout, so those fixtures carry a `penWinner`.
  const isKnockoutRound = (round) => normalizeRound(round) !== 'Group Stage';
  // The team name behind a fixture's penWinner ('team1' | 'team2'), or null.
  const penWinnerTeam = (m) => !m || !m.penWinner ? null : (m.penWinner === 'team1' ? m.team1 : m.team2);

  // Two fixtures (a prediction, a logged result, or a coverage-matrix row —
  // anything with team1/team2/round) are the same real-world match only if
  // both the teams AND the round match. Needed because the same two teams
  // can meet twice in a tournament (e.g. group stage, then again in the
  // knockouts) — matching on team names alone would conflate the two.
  const sameFixture = (a, b) =>
    normalizeTeamName(a.team1) === normalizeTeamName(b.team1) &&
    normalizeTeamName(a.team2) === normalizeTeamName(b.team2) &&
    normalizeRound(a.round) === normalizeRound(b.round);

  // Sets of 2+ predictions by the same player for the same match — accidental
  // double-entries to clean up. Teams are matched in either order (so a
  // reversed "France vs Brazil" / "Brazil vs France" re-paste is caught too),
  // within the same round. Returned newest-first within each group.
  const findDuplicateGroups = (predictions) => {
    const map = {};
    predictions.forEach(p => {
      const teams = [normalizeTeamName(p.team1), normalizeTeamName(p.team2)].sort().join('_');
      const key = `${p.userId}|${teams}|${normalizeRound(p.round)}`;
      (map[key] = map[key] || []).push(p);
    });
    return Object.values(map)
      .filter(g => g.length > 1)
      .map(g => [...g].sort((a, b) => (b.ts || 0) - (a.ts || 0)));
  };

  // normalizedTeamName -> ISO 3166-1 alpha-2 (for flagcdn images). Covers the
  // realistic World Cup field; anything unmapped falls back to a lettered chip.
  const TEAM_ISO = {
    france:'fr', senegal:'sn', iraq:'iq', norway:'no', argentina:'ar', algeria:'dz',
    austria:'at', jordan:'jo', belgium:'be', egypt:'eg', saudiarabia:'sa', uruguay:'uy',
    iran:'ir', newzealand:'nz',
    brazil:'br', spain:'es', germany:'de', england:'gb-eng', scotland:'gb-sct', wales:'gb-wls',
    portugal:'pt', netherlands:'nl', holland:'nl', italy:'it', croatia:'hr', denmark:'dk',
    switzerland:'ch', poland:'pl', serbia:'rs', morocco:'ma', tunisia:'tn', ghana:'gh',
    bosnia:'ba', bosniaherzegovina:'ba', bosniaandherzegovina:'ba', curacao:'cw',
    cameroon:'cm', nigeria:'ng', ivorycoast:'ci', senegalese:'sn', southafrica:'za',
    mexico:'mx', usa:'us', unitedstates:'us', canada:'ca', costarica:'cr', ecuador:'ec',
    colombia:'co', peru:'pe', paraguay:'py', chile:'cl', bolivia:'bo', venezuela:'ve',
    japan:'jp', southkorea:'kr', korea:'kr', australia:'au', qatar:'qa', uae:'ae',
    unitedarabemirates:'ae', uzbekistan:'uz', bahrain:'bh', china:'cn', panama:'pa',
    honduras:'hn', jamaica:'jm', haiti:'ht', sweden:'se', turkey:'tr', greece:'gr', ukraine:'ua',
    romania:'ro', hungary:'hu', czechia:'cz', slovakia:'sk', slovenia:'si', capeverde:'cv',
    drcongo:'cd', mali:'ml', kenya:'ke', ireland:'ie'
  };

  // Returns a flag <img> (works on every OS, unlike flag emoji) or, for an
  // unknown team, a small lettered chip. Used inline anywhere a flag appears.
  const getFlagEmoji = (country) => {
    const iso = TEAM_ISO[normalizeTeamName(country)];
    if (iso) {
      return <img
        src={`https://flagcdn.com/h20/${iso}.png`}
        srcSet={`https://flagcdn.com/h40/${iso}.png 2x`}
        alt="" title={country}
        className="inline-block shrink-0 h-[1em] w-auto rounded-[2px] shadow-sm align-[-0.15em]" />;
    }
    const code = String(country || '').replace(/[^a-zA-Z]/g, '').slice(0, 3).toUpperCase() || '?';
    return <span title={country}
      className="inline-flex shrink-0 items-center justify-center h-[1em] min-w-[1.5em] px-1 rounded-[2px] bg-gray-300 text-gray-600 text-[0.5em] font-bold leading-none align-[-0.15em]">{code}</span>;
  };

  // Which side goes through in a knockout fixture: the higher score, or the
  // shootout winner when it's level. Works for a prediction or a result.
  const advancingSide = (m) => {
    if (m.score1 > m.score2) return 'team1';
    if (m.score2 > m.score1) return 'team2';
    return m.penWinner || null;
  };

  // koScoreMode 'route' (default) additionally credits the outcome point for
  // picking the team that actually advanced, however it got there (e.g. you
  // predicted a 1-0 win but it was level and won on pens). 'strict' only
  // rewards the predicted route. The full 3 (exact score + right pens winner)
  // and group-stage scoring are identical in both modes.
  const calculatePoints = (pred, real, koScoreMode = 'route') => {
    if (!real) return 0;
    let pts;
    // Knockout that went to penalties: the recorded 120-min score is level and
    // a shootout winner is set. Full marks need the exact level score AND the
    // right team through; merely calling the draw is still the outcome point.
    if (isKnockoutRound(real.round) && real.score1 === real.score2 && real.penWinner) {
      const predDraw = pred.score1 === pred.score2;
      if (predDraw && pred.score1 === real.score1 && pred.penWinner === real.penWinner) pts = 3;
      else if (predDraw) pts = 1;
      else pts = 0;
    } else if (pred.score1 === real.score1 && pred.score2 === real.score2) {
      pts = 3;
    } else if (Math.sign(pred.score1 - pred.score2) === Math.sign(real.score1 - real.score2)) {
      pts = 1;
    } else {
      pts = 0;
    }
    if (pts === 0 && koScoreMode === 'route' && isKnockoutRound(real.round)) {
      const a = advancingSide(real), p = advancingSide(pred);
      if (a && p && a === p) pts = 1;
    }
    return pts;
  };

  // Local YYYY-MM-DD for today (avoids UTC off-by-one from toISOString).
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  // Pretty label for a YYYY-MM-DD matchday, e.g. "Mon, Jun 15".
  const formatDay = (d) => {
    if (!d || d === 'Undated') return 'Undated';
    const dt = new Date(d + 'T00:00:00');
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  };
  // Short "how long ago" label for an epoch-ms timestamp, e.g. "3m ago".
  const relativeTime = (ts) => {
    if (!ts) return '';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 45) return 'just now';
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    return d === 1 ? 'yesterday' : `${d}d ago`;
  };

  // --- Initial Mock Data ---
  const initialUsers = [
    { id: 'u1', name: 'User 1' },
    { id: 'u2', name: 'User 2' },
    { id: 'u3', name: 'User 3' }
  ];

  const initialPredictions = [
    { id: 'p1', userId: 'u1', team1: 'France', team2: 'Senegal', score1: 3, score2: 1 },
    { id: 'p2', userId: 'u1', team1: 'Iraq', team2: 'Norway', score1: 1, score2: 2 },
    { id: 'p3', userId: 'u1', team1: 'Argentina', team2: 'Algeria', score1: 2, score2: 1 },
    { id: 'p4', userId: 'u1', team1: 'Austria', team2: 'Jordan', score1: 2, score2: 2 },

    { id: 'p5', userId: 'u2', team1: 'Belgium', team2: 'Egypt', score1: 2, score2: 1 },
    { id: 'p6', userId: 'u2', team1: 'Saudi Arabia', team2: 'Uruguay', score1: 0, score2: 2 },
    { id: 'p7', userId: 'u2', team1: 'Iran', team2: 'New Zealand', score1: 3, score2: 0 },

    { id: 'p8', userId: 'u3', team1: 'Belgium', team2: 'Egypt', score1: 3, score2: 0 },
    { id: 'p9', userId: 'u3', team1: 'Saudi Arabia', team2: 'Uruguay', score1: 0, score2: 1 },
    { id: 'p10', userId: 'u3', team1: 'Iran', team2: 'New Zealand', score1: 1, score2: 1 }
  ];

  const initialRealResults = [
    { id: 'r3', date: '2026-06-14', team1: 'Iran', team2: 'New Zealand', score1: 3, score2: 0 },
    { id: 'r1', date: '2026-06-15', team1: 'Belgium', team2: 'Egypt', score1: 2, score2: 1 },
    { id: 'r2', date: '2026-06-15', team1: 'Saudi Arabia', team2: 'Uruguay', score1: 0, score2: 2 }
  ];

  function App() {
    const [users, setUsers] = useState(initialUsers);
    const [predictions, setPredictions] = useState(initialPredictions);
    const [realResults, setRealResults] = useState(initialRealResults);
    const [activeTab, setActiveTab] = useState('leaderboard');
    // Tiebreaker order when players are level on points: which secondary
    // stat decides the placing first. 'exact-first' (more exact scores wins)
    // is the default criteria.
    const [tiebreakMode, setTiebreakMode] = useState('exact-first');
    // How many recent results show up as dots in the leaderboard's FORM column.
    const [formCount, setFormCount] = useState(6);
    // How many ranked rows the standings table shows. Infinity = show everyone (default).
    const [positionsCount, setPositionsCount] = useState(Infinity);
    // Knockout pens scoring: 'route' credits the right team advancing by any
    // route (default); 'strict' only credits the predicted route.
    const [koScoreMode, setKoScoreMode] = useState('route');

    // --- Score Calculation ---
    const leaderboard = useMemo(() => {
      const stats = users.map(user => {
        let totalPoints = 0;
        let exactMatches = 0;
        let correctOutcomes = 0;
        let completedPicks = 0;
        let form = [];

        const userPreds = predictions.filter(p => p.userId === user.id);
        const chronologicalResults = [...realResults];

        chronologicalResults.forEach(real => {
          const pred = userPreds.find(p => sameFixture(p, real));

          if (pred) {
            completedPicks++;
            const pts = calculatePoints(pred, real, koScoreMode);
            totalPoints += pts;
            if (pts === 3) exactMatches += 1;
            if (pts === 1) correctOutcomes += 1;
            form.push(pts);
          } else {
            // Match happened but this player never predicted it — a grey gap
            // in their form (doesn't count toward points or picks).
            form.push(null);
          }
        });

        return { ...user, totalPoints, exactMatches, correctOutcomes, userPreds, form: form.slice(-formCount), completedPicks };
      });

      const tiebreak = (a, b) => {
        if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints; // PTS (more)
        // "Fewer picks" only rewards efficiency among players who've actually
        // scored. At 0 points it would rank a no-show above someone who
        // predicted and missed, so ignore it there — leaving them fully tied.
        const picksCmp = a.totalPoints > 0 ? a.completedPicks - b.completedPicks : 0; // PICKS (less)
        if (tiebreakMode === 'exact-first') {
          if (b.exactMatches !== a.exactMatches) return b.exactMatches - a.exactMatches; // EXACT (more)
          if (picksCmp !== 0) return picksCmp;
        } else {
          if (picksCmp !== 0) return picksCmp;
          if (b.exactMatches !== a.exactMatches) return b.exactMatches - a.exactMatches; // EXACT (more)
        }
        return b.correctOutcomes - a.correctOutcomes; // OUTCOME (more)
      };
      stats.sort(tiebreak);

      // Assign display ranks: tied players share a rank; next player skips ahead.
      // e.g. three-way tie for 2nd → 2,2,2 then 5th.
      const assignRanks = (arr) => {
        arr.forEach((s, i) => {
          s.rank = i === 0 ? 1 : (tiebreak(arr[i - 1], s) === 0 ? arr[i - 1].rank : i + 1);
        });
      };
      assignRanks(stats);

      // --- Movement vs the previous matchday ---
      // Re-rank using only results up to (but excluding) the latest matchday,
      // then compare each player's prior rank to their current rank.
      const rankBy = (resultSet) => {
        const rows = users.map(user => {
          let totalPoints = 0, exactMatches = 0, correctOutcomes = 0, completedPicks = 0;
          const preds = predictions.filter(p => p.userId === user.id);
          resultSet.forEach(real => {
            const pred = preds.find(p => sameFixture(p, real));
            if (pred) {
              completedPicks++;
              const pts = calculatePoints(pred, real, koScoreMode);
              totalPoints += pts;
              if (pts === 3) exactMatches++; else if (pts === 1) correctOutcomes++;
            }
          });
          return { id: user.id, totalPoints, exactMatches, correctOutcomes, completedPicks };
        });
        rows.sort(tiebreak);
        assignRanks(rows);
        const map = {};
        rows.forEach(r => { map[r.id] = r.rank; });
        return map;
      };

      const days = [...new Set(realResults.map(r => r.date || ''))].sort();
      let prevRanks = null;
      if (days.length >= 2) {
        const latestDay = days[days.length - 1];
        prevRanks = rankBy(realResults.filter(r => (r.date || '') < latestDay));
      }
      stats.forEach(s => {
        s.movement = prevRanks ? (prevRanks[s.id] - s.rank) : null; // + up, - down, 0 same
      });

      return stats;
    }, [users, predictions, realResults, tiebreakMode, formCount, koScoreMode]);

    // --- Main Render ---
    return (
      <div className="min-h-screen bg-[#FDFBF7] text-[#333] font-sans selection:bg-[#D4AF37] selection:text-white">
        <style>{customStyles}</style>

        {/* Header */}
        <header className="bg-[#1B4D3E] text-white p-6 shadow-md border-b-8 border-[#D4AF37]">
          <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-3">
              <Trophy size={40} className="text-[#D4AF37]" />
              <div>
                <h1 className="font-oswald text-3xl md:text-4xl font-bold uppercase tracking-wide text-[#FDFBF7]">
                  TexAus World Cup 2026 Predictions
                </h1>
              </div>
            </div>

            <nav className="flex justify-center flex-wrap gap-2 sm:gap-3 w-full md:w-auto mt-4 md:mt-0 font-oswald">
              {[
                { id: 'leaderboard', label: 'Scoreboard' },
                { id: 'user-picks', label: 'Player Picks' },
                { id: 'predictions', label: 'Paste Picks' },
                { id: 'admin', label: 'Results' },
                { id: 'backup', label: 'Backup' },
                { id: 'feedback', label: 'Feedback' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 sm:px-5 py-2 text-sm sm:text-base font-bold uppercase tracking-widest rounded-full border-2 transition-all duration-200 ${
                    activeTab === tab.id
                      ? 'bg-[#D4AF37] text-[#1B4D3E] border-[#D4AF37] shadow-md scale-105'
                      : 'bg-[#0d2a21]/60 text-gray-300 border-transparent hover:bg-[#0d2a21] hover:text-white'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>
          </div>
        </header>

        {/* Main Content Area */}
        <main className="max-w-6xl mx-auto p-6 min-h-[80vh]">
          {activeTab === 'leaderboard' && (
            <LeaderboardView leaderboard={leaderboard} realResults={realResults} tiebreakMode={tiebreakMode} setTiebreakMode={setTiebreakMode} formCount={formCount} setFormCount={setFormCount} positionsCount={positionsCount} setPositionsCount={setPositionsCount} koScoreMode={koScoreMode} setKoScoreMode={setKoScoreMode} />
          )}
          {activeTab === 'user-picks' && (
            <UserPicksView
              users={users}
              predictions={predictions}
              setPredictions={setPredictions}
              realResults={realResults}
              koScoreMode={koScoreMode}
            />
          )}
          {activeTab === 'predictions' && (
            <PredictionsView
              users={users}
              setUsers={setUsers}
              predictions={predictions}
              setPredictions={setPredictions}
            />
          )}
          {activeTab === 'admin' && (
            <AdminView
              realResults={realResults}
              setRealResults={setRealResults}
              predictions={predictions}
            />
          )}
          {activeTab === 'backup' && (
            <BackupView
              users={users}
              setUsers={setUsers}
              predictions={predictions}
              setPredictions={setPredictions}
              realResults={realResults}
              setRealResults={setRealResults}
            />
          )}
          {activeTab === 'feedback' && <FeedbackView />}
        </main>
      </div>
    );
  }

  // --- VIEWS ---

  function LeaderboardView({ leaderboard, realResults, tiebreakMode, setTiebreakMode, formCount, setFormCount, positionsCount, setPositionsCount, koScoreMode, setKoScoreMode }) {
    const [exporting, setExporting] = useState(false);
    // Optionally drop players who haven't predicted any match that's been
    // played yet (completedPicks === 0). Ranks/movement are still computed over
    // everyone — this only filters what the board shows.
    const [hideInactive, setHideInactive] = useState(false);

    const shownLeaderboard = hideInactive ? leaderboard.filter(u => u.completedPicks > 0) : leaderboard;
    const hiddenCount = leaderboard.length - shownLeaderboard.length;

    // Optional diagonal rubber-stamp over the standings (also captured in the
    // saved image). Empty = no stamp. Colour defaults to a stamp-red so it
    // stands apart from the gold title.
    const [stampText, setStampText] = useState('');
    const [stampPos, setStampPos] = useState('top-right');
    const [stampRotation, setStampRotation] = useState(-11);
    const [stampColor, setStampColor] = useState('#C0392B');
    // Fine nudge (px) from the chosen anchor: +X right, +Y down.
    const [stampOffsetX, setStampOffsetX] = useState(0);
    const [stampOffsetY, setStampOffsetY] = useState(0);
    // Show the ▲/▼ change-vs-last-matchday indicator next to each rank.
    const [showMovement, setShowMovement] = useState(true);

    const podiumRank1 = shownLeaderboard.filter(u => u.rank === 1);
    const podiumRank2 = shownLeaderboard.filter(u => u.rank === 2);
    const podiumRank3 = shownLeaderboard.filter(u => u.rank === 3);
    const leaderPoints = (leaderboard[0] && leaderboard[0].totalPoints) || 0;

    const totalPlayers = shownLeaderboard.length;
    const visiblePositions = positionsCount === Infinity ? totalPlayers : Math.min(positionsCount, totalPlayers);
    const displayedLeaderboard = shownLeaderboard.slice(0, visiblePositions);

    const totalPicks   = leaderboard.reduce((s, u) => s + u.completedPicks, 0);
    const totalExact   = leaderboard.reduce((s, u) => s + u.exactMatches, 0);
    const totalOutcome = leaderboard.reduce((s, u) => s + u.correctOutcomes, 0);
    const maxExact     = Math.max(0, ...leaderboard.map(u => u.exactMatches));
    const bestPickers  = maxExact > 0 ? leaderboard.filter(u => u.exactMatches === maxExact) : [];
    const headerDate   = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

    // Save the standings panel as a PNG to share in the group chat.
    // Before capturing we (1) freeze animations and hide the leader's foil
    // sweep so we get a clean static frame, and (2) zero the panel's margin —
    // the parent's space-y-8 adds a 32px top margin that html-to-image would
    // otherwise bake in, pushing the content down (empty top, cut bottom).
    const exportStandings = async () => {
      const node = document.getElementById('standings-capture');
      if (!node || !window.htmlToImage) {
        alert('Export tool is still loading — give it a second and try again.');
        return;
      }
      setExporting(true);
      const freeze = document.createElement('style');
      freeze.textContent =
        '#standings-capture *,#standings-capture *::before,#standings-capture *::after{animation:none!important;transition:none!important}' +
        '#standings-capture .leader-foil::after{display:none!important}';
      document.head.appendChild(freeze);
      try {
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        const dataUrl = await window.htmlToImage.toPng(node, {
          backgroundColor: '#111111',
          pixelRatio: 2,
          style: { margin: '0' }
        });
        const a = document.createElement('a');
        a.download = `texaus-standings-${todayStr()}.png`;
        a.href = dataUrl;
        a.click();
      } catch (err) {
        alert('Sorry, the image export failed: ' + (err && err.message ? err.message : err));
      } finally {
        freeze.remove();
        setExporting(false);
      }
    };

    return (
      <div className="space-y-8 animate-in fade-in zoom-in-95 duration-300">

        <div className="flex flex-wrap justify-between items-center gap-3 mb-2">
          <div className="flex flex-wrap items-center gap-x-8 gap-y-3 bg-gray-50 border-2 border-gray-200 rounded-2xl px-4 py-2.5">
            {/* Scoring rules */}
            <div className="flex flex-wrap items-center gap-3 sm:gap-4">
              <span className="text-[10px] font-black uppercase tracking-widest text-gray-400 font-oswald">Scoring</span>
              <div className="flex items-center gap-2 font-oswald">
                <label htmlFor="tiebreak-select" className="text-xs font-bold uppercase tracking-wider text-gray-500">Tiebreaker</label>
                <select
                  id="tiebreak-select"
                  value={tiebreakMode}
                  onChange={(e) => setTiebreakMode(e.target.value)}
                  title="Order of criteria used to split players level on points"
                  className="text-sm font-bold text-[#1B4D3E] bg-white border-2 border-gray-200 rounded-full px-3 py-1.5 outline-none focus:border-[#D4AF37] cursor-pointer"
                >
                  <option value="picks-first">Points → Picks (less) → Exact (more)</option>
                  <option value="exact-first">Points → Exact (more) → Picks (less)</option>
                </select>
              </div>

              <div className="hidden sm:block w-px h-6 bg-gray-200"></div>

              <div className="flex items-center gap-2 font-oswald">
                <label htmlFor="pens-select" className="text-xs font-bold uppercase tracking-wider text-gray-500">Pens</label>
                <select
                  id="pens-select"
                  value={koScoreMode}
                  onChange={(e) => setKoScoreMode(e.target.value)}
                  title="How knockout penalty shootouts are scored when your predicted route differs from what happened"
                  className="text-sm font-bold text-[#1B4D3E] bg-white border-2 border-gray-200 rounded-full px-3 py-1.5 outline-none focus:border-[#D4AF37] cursor-pointer"
                >
                  <option value="route">Right team through (any route)</option>
                  <option value="strict">Exact route only</option>
                </select>
              </div>
            </div>

            {/* Display options */}
            <div className="flex flex-wrap items-center gap-3 sm:gap-4">
              <span className="text-[10px] font-black uppercase tracking-widest text-gray-400 font-oswald">Display</span>
              <div className="flex items-center gap-2 font-oswald">
                <label htmlFor="form-count-slider" className="text-xs font-bold uppercase tracking-wider text-gray-500">Form</label>
                <input
                  id="form-count-slider"
                  type="range"
                  min="3"
                  max="10"
                  step="1"
                  value={formCount}
                  onChange={(e) => setFormCount(Number(e.target.value))}
                  title="Number of recent results shown as dots in the FORM column"
                  className="w-24 accent-[#1B4D3E] cursor-pointer"
                />
                <span className="text-sm font-bold text-[#1B4D3E] w-5 text-center">{formCount}</span>
              </div>

              <div className="hidden sm:block w-px h-6 bg-gray-200"></div>

              <div className="flex items-center gap-2 font-oswald">
                <label htmlFor="positions-count-slider" className="text-xs font-bold uppercase tracking-wider text-gray-500">Positions</label>
                <input
                  id="positions-count-slider"
                  type="range"
                  min="1"
                  max={Math.max(totalPlayers, 1)}
                  step="1"
                  value={visiblePositions}
                  disabled={totalPlayers <= 1}
                  onChange={(e) => {
                    const val = Number(e.target.value);
                    setPositionsCount(val >= totalPlayers ? Infinity : val);
                  }}
                  title="How many ranked positions the standings table shows"
                  className="w-24 accent-[#1B4D3E] cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
                />
                <span className="text-sm font-bold text-[#1B4D3E] w-9 text-center">{positionsCount === Infinity ? 'All' : visiblePositions}</span>
              </div>

              <div className="hidden sm:block w-px h-6 bg-gray-200"></div>

              <div className="flex items-center gap-2 font-oswald">
                <label className="text-xs font-bold uppercase tracking-wider text-gray-500">Movement</label>
                <button
                  onClick={() => setShowMovement(v => !v)}
                  title="Show or hide the ▲▼ change-vs-last-matchday indicator"
                  className={`text-sm font-bold rounded-full px-3 py-1.5 border-2 transition-all cursor-pointer ${showMovement ? 'bg-[#1B4D3E] text-white border-[#1B4D3E]' : 'bg-white text-[#1B4D3E] border-gray-200 hover:border-[#D4AF37]'}`}
                >
                  {showMovement ? 'On' : 'Off'}
                </button>
              </div>

              <div className="hidden sm:block w-px h-6 bg-gray-200"></div>

              <div className="flex items-center gap-2 font-oswald">
                <label className="text-xs font-bold uppercase tracking-wider text-gray-500">Show</label>
                <button
                  onClick={() => setHideInactive(v => !v)}
                  title={hideInactive ? `Hiding ${hiddenCount} player${hiddenCount === 1 ? '' : 's'} with no completed picks` : 'Showing everyone, including players with no completed picks'}
                  className={`text-sm font-bold rounded-full px-3 py-1.5 border-2 transition-all cursor-pointer ${hideInactive ? 'bg-[#1B4D3E] text-white border-[#1B4D3E]' : 'bg-white text-[#1B4D3E] border-gray-200 hover:border-[#D4AF37]'}`}
                >
                  {hideInactive ? `Played only${hiddenCount > 0 ? ` (−${hiddenCount})` : ''}` : 'Everyone'}
                </button>
              </div>

            </div>

            {/* Stamp */}
            <div className="flex flex-wrap items-center gap-3 sm:gap-4">
              <span className="text-[10px] font-black uppercase tracking-widest text-gray-400 font-oswald">Stamp</span>
              <div className="flex items-center gap-2 font-oswald">
                <label htmlFor="stamp-text" className="text-xs font-bold uppercase tracking-wider text-gray-500">Text</label>
                <input
                  id="stamp-text"
                  type="text"
                  value={stampText}
                  onChange={(e) => setStampText(e.target.value)}
                  maxLength={24}
                  placeholder="none"
                  title="Adds a diagonal stamp to the standings (and the saved image). Leave blank for none."
                  className="w-28 bg-white border-2 border-gray-200 rounded-full px-3 py-1 text-sm font-bold text-[#1B4D3E] outline-none focus:border-[#D4AF37]"
                />
              </div>

              {stampText.trim() && (
                <>
                  <div className="hidden sm:block w-px h-6 bg-gray-200"></div>
                  <div className="flex items-center gap-2 font-oswald">
                    <label htmlFor="stamp-pos" className="text-xs font-bold uppercase tracking-wider text-gray-500">Pos</label>
                    <select
                      id="stamp-pos"
                      value={stampPos}
                      onChange={(e) => setStampPos(e.target.value)}
                      className="text-sm font-bold text-[#1B4D3E] bg-white border-2 border-gray-200 rounded-full px-3 py-1.5 outline-none focus:border-[#D4AF37] cursor-pointer"
                    >
                      <option value="top-left">Top left</option>
                      <option value="top-right">Top right</option>
                      <option value="bottom-left">Bottom left</option>
                      <option value="bottom-right">Bottom right</option>
                      <option value="center">Center</option>
                    </select>
                  </div>

                  <div className="hidden sm:block w-px h-6 bg-gray-200"></div>

                  <div className="flex items-center gap-2 font-oswald">
                    <label htmlFor="stamp-rot" className="text-xs font-bold uppercase tracking-wider text-gray-500">Tilt</label>
                    <input
                      id="stamp-rot"
                      type="range" min="-45" max="45" step="1"
                      value={stampRotation}
                      onChange={(e) => setStampRotation(Number(e.target.value))}
                      title="Stamp rotation"
                      className="w-24 accent-[#1B4D3E] cursor-pointer"
                    />
                    <span className="text-sm font-bold text-[#1B4D3E] w-9 text-center">{stampRotation}°</span>
                  </div>

                  <div className="hidden sm:block w-px h-6 bg-gray-200"></div>

                  <div className="flex items-center gap-2 font-oswald">
                    <label htmlFor="stamp-color" className="text-xs font-bold uppercase tracking-wider text-gray-500">Color</label>
                    <input
                      id="stamp-color"
                      type="color"
                      value={stampColor}
                      onChange={(e) => setStampColor(e.target.value)}
                      title="Stamp colour"
                      className="w-8 h-8 rounded cursor-pointer border-2 border-gray-200 bg-white p-0.5"
                    />
                  </div>

                  <div className="hidden sm:block w-px h-6 bg-gray-200"></div>

                  <div className="flex items-center gap-2 font-oswald">
                    <label htmlFor="stamp-x" className="text-xs font-bold uppercase tracking-wider text-gray-500">Nudge</label>
                    <input
                      id="stamp-x"
                      type="range" min="-150" max="150" step="1"
                      value={stampOffsetX}
                      onChange={(e) => setStampOffsetX(Number(e.target.value))}
                      title="Horizontal offset (+ right)"
                      className="w-20 accent-[#1B4D3E] cursor-pointer"
                    />
                    <span className="text-[10px] font-bold text-gray-400">X</span>
                    <input
                      id="stamp-y"
                      type="range" min="-150" max="150" step="1"
                      value={stampOffsetY}
                      onChange={(e) => setStampOffsetY(Number(e.target.value))}
                      title="Vertical offset (+ down)"
                      className="w-20 accent-[#1B4D3E] cursor-pointer"
                    />
                    <span className="text-[10px] font-bold text-gray-400">Y</span>
                    {(stampOffsetX !== 0 || stampOffsetY !== 0) && (
                      <button
                        onClick={() => { setStampOffsetX(0); setStampOffsetY(0); }}
                        title="Reset nudge"
                        className="text-gray-400 hover:text-gray-600 font-bold text-sm leading-none px-1"
                      >
                        ↺
                      </button>
                    )}
                  </div>
                </>
              )}
            </div>
          </div>
          <button
            onClick={exportStandings}
            disabled={exporting}
            title="Save the standings as an image to share"
            className="flex items-center gap-2 text-sm font-bold text-[#1B4D3E] bg-[#D4AF37] hover:bg-amber-400 transition-colors px-4 py-1.5 rounded-full shadow-sm border border-amber-500/40 disabled:opacity-60 disabled:cursor-wait"
          >
            <Download size={18} /> {exporting ? 'Saving…' : 'Save Image'}
          </button>
        </div>

        {/* Stadium Scoreboard */}
        <div id="standings-capture" className="bg-[#111] border-8 border-[#333] rounded-lg p-6 shadow-2xl relative overflow-hidden font-vt323">
          {/* Subtle grid pattern background for scoreboard */}
          <div className="absolute inset-0 opacity-20 pointer-events-none" style={{ backgroundImage: 'linear-gradient(#222 1px, transparent 1px), linear-gradient(90deg, #222 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

          {/* Optional diagonal rubber-stamp */}
          {stampText.trim() && (() => {
            const posClass = {
              'top-left': 'top-3 left-3 sm:top-5 sm:left-6',
              'top-right': 'top-3 right-3 sm:top-5 sm:right-6',
              'bottom-left': 'bottom-3 left-3 sm:bottom-5 sm:left-6',
              'bottom-right': 'bottom-3 right-3 sm:bottom-5 sm:right-6',
              'center': 'top-1/2 left-1/2'
            }[stampPos] || 'top-3 right-3 sm:top-5 sm:right-6';
            const base = stampPos === 'center'
              ? `translate(calc(-50% + ${stampOffsetX}px), calc(-50% + ${stampOffsetY}px))`
              : `translate(${stampOffsetX}px, ${stampOffsetY}px)`;
            const transform = `${base} rotate(${stampRotation}deg)`;
            return (
              <div className={`absolute ${posClass} z-20 pointer-events-none select-none`} style={{ transform }}>
                <div
                  className="font-oswald font-black uppercase tracking-[0.15em] border-[3px] rounded px-2.5 sm:px-3 py-0.5 sm:py-1 text-sm sm:text-2xl"
                  style={{ color: stampColor, borderColor: stampColor, opacity: 0.9, boxShadow: '0 0 0 2px rgba(17,17,17,0.55)' }}
                >
                  {stampText}
                </div>
              </div>
            );
          })()}

          <div className="relative z-10 flex flex-col gap-4">
            {/* Identity header — visible in the exported image */}
            <div className="text-center font-oswald text-[#666] text-xs md:text-sm tracking-[0.2em] uppercase">
              TexAus &middot; World Cup 2026 &middot; {headerDate}
            </div>
            <div className="flex justify-center items-start">
              <h2 className="text-[#D4AF37] text-4xl uppercase text-center tracking-widest border-b-2 border-[#D4AF37]/30 pb-4 mb-4 flex items-center justify-center gap-3 drop-shadow-[0_0_8px_rgba(212,175,55,0.8)]">
                <Crown className="text-[#D4AF37]" size={36} />
                Global Rankings
                <Crown className="text-[#D4AF37]" size={36} />
              </h2>
            </div>

            {/* TOP 3 PODIUM */}
            {podiumRank1.length > 0 && (
              <div className="flex justify-center items-end gap-2 sm:gap-6 mb-8 mt-4 h-48 font-oswald tracking-wide">
                {/* 2nd Place */}
                {podiumRank2.length > 0 && (
                  <div className="flex flex-col items-center animate-in slide-in-from-bottom duration-500 delay-100">
                    <div className="bg-gray-300 text-black font-black px-4 py-2 rounded-t-lg text-lg flex flex-col items-center shadow-md">
                      <Medal size={24} className="mb-1 text-gray-600"/>
                      {podiumRank2.map(u => u.name).join(' & ')}
                    </div>
                    <div className="metal-texture bg-gradient-to-b from-gray-200 via-gray-400 to-gray-600 w-24 h-24 sm:w-32 flex items-center justify-center text-white font-black text-3xl border-t-4 border-white shadow-[inset_0_3px_0_rgba(255,255,255,0.8),0_10px_15px_-3px_rgba(0,0,0,0.6)]">
                      {podiumRank2[0].totalPoints}pts
                    </div>
                  </div>
                )}
                {/* 1st Place */}
                <div className="flex flex-col items-center animate-in slide-in-from-bottom duration-500 z-10">
                  <div className="bg-[#D4AF37] text-black font-black px-6 py-3 rounded-t-lg text-xl flex flex-col items-center shadow-[0_0_15px_rgba(212,175,55,0.6)]">
                    <Crown size={32} className="mb-1 text-amber-900"/>
                    {podiumRank1.map(u => u.name).join(' & ')}
                  </div>
                  <div className="metal-texture bg-gradient-to-b from-yellow-300 via-amber-500 to-amber-700 w-28 h-32 sm:w-40 flex items-center justify-center text-white font-black text-5xl border-t-4 border-yellow-100 shadow-[inset_0_3px_0_rgba(255,255,255,0.8),0_10px_15px_-3px_rgba(0,0,0,0.8)]">
                    {podiumRank1[0].totalPoints}pts
                  </div>
                </div>
                {/* 3rd Place */}
                {podiumRank3.length > 0 && (
                  <div className="flex flex-col items-center animate-in slide-in-from-bottom duration-500 delay-200">
                    <div className="bg-amber-700 text-white font-black px-4 py-2 rounded-t-lg text-lg flex flex-col items-center shadow-md">
                      <Medal size={24} className="mb-1 text-amber-300"/>
                      {podiumRank3.map(u => u.name).join(' & ')}
                    </div>
                    <div className="metal-texture bg-gradient-to-b from-orange-300 via-amber-700 to-amber-900 w-24 h-20 sm:w-32 flex items-center justify-center text-white font-black text-3xl border-t-4 border-orange-200 shadow-[inset_0_3px_0_rgba(255,255,255,0.6),0_10px_15px_-3px_rgba(0,0,0,0.6)]">
                      {podiumRank3[0].totalPoints}pts
                    </div>
                  </div>
                )}
              </div>
            )}

            <div className="grid grid-cols-12 gap-1 md:gap-2 px-2 md:px-3 text-gray-400 font-oswald font-bold text-[11px] md:text-sm uppercase tracking-wider mb-2 border-b border-[#333] pb-2">
              <div className="col-span-1 text-center">Pos</div>
              <div className="col-span-4">Player</div>
              <div className="col-span-2 text-center" title="Form Guide (Last 5)">Form</div>
              <div className="col-span-1 text-center" title="Completed Predictions">Picks</div>
              <div className="col-span-1 text-center" title="Exact Score (3pts)">Exact</div>
              <div className="col-span-1 text-center" title="Correct Outcome (1pt)">Outcome</div>
              <div className="col-span-2 text-center text-amber-500">Pts</div>
            </div>

            <div className="space-y-2 text-xl md:text-3xl">
              {displayedLeaderboard.map((user, idx) => (
                <div key={user.id} className={`grid grid-cols-12 gap-1 md:gap-2 items-center p-2 md:p-3 rounded transition-colors relative overflow-hidden ${user.rank === 1 ? 'leader-foil bg-amber-900/40 text-amber-300 border border-amber-500/30' : user.rank === 2 ? 'bg-gray-800/60 text-gray-300 border border-gray-400/25 shadow-[0_0_10px_rgba(192,192,192,0.08)]' : user.rank === 3 ? 'bg-amber-950/40 text-amber-600 border border-amber-800/40' : idx % 2 === 0 ? 'bg-[#161616] text-gray-400' : 'bg-[#111] text-gray-400'}`}>

                      <span
                        className={`text-[11px] md:text-xs font-sans font-bold ${user.movement > 0 ? 'text-green-400' : user.movement < 0 ? 'text-red-400' : 'text-gray-500'}`}
